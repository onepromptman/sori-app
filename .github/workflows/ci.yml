name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test slide imports
        run: node --test browser/slides/slides.test.mjs
      - name: Build web ZIPs
        run: python3 browser/build.py build/sori-web
