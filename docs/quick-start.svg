<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Sori in three steps"><rect width="960" height="330" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="30" y="44" font-size="20" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Sori in three steps</text><rect x="30" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><circle cx="60" cy="100" r="16" fill="#1d4f91"/><text x="60" y="106" font-size="16" fill="#ffffff" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">1</text><text x="86" y="106" font-size="17" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Install</text><rect x="46" y="128" width="258" height="82" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="58" y="150" font-size="13" fill="#1f2328" font-weight="400" font-family="ui-monospace,Consolas,Menlo,monospace" text-anchor="start">/plugin marketplace add</text><text x="58" y="170" font-size="13" fill="#1f2328" font-weight="400" font-family="ui-monospace,Consolas,Menlo,monospace" text-anchor="start">  onepromptman/sori-app</text><text x="58" y="190" font-size="13" fill="#1f2328" font-weight="400" font-family="ui-monospace,Consolas,Menlo,monospace" text-anchor="start">/plugin install sori@sori</text><text x="48" y="242" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Paste both lines into Claude Code,</text><text x="48" y="262" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">or upload sori.zip in the Claude</text><text x="48" y="282" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">desktop app.</text><path d="M322 184 h9 m-5 -5 l5 5 l-5 5" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="335" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><circle cx="365" cy="100" r="16" fill="#1d4f91"/><text x="365" y="106" font-size="16" fill="#ffffff" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">2</text><text x="391" y="106" font-size="17" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Transcribe</text><rect x="351" y="128" width="258" height="42" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="363" y="150" font-size="13" fill="#1f2328" font-weight="400" font-family="ui-monospace,Consolas,Menlo,monospace" text-anchor="start">/sori:transcribe</text><text x="353" y="202" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Paste a YouTube link, a podcast</text><text x="353" y="222" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">feed or an audio file. The first</text><text x="353" y="242" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">run sets itself up.</text><path d="M627 184 h9 m-5 -5 l5 5 l-5 5" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="640" y="66" width="290" height="236" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><circle cx="670" cy="100" r="16" fill="#1d4f91"/><text x="670" y="106" font-size="16" fill="#ffffff" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">3</text><text x="696" y="106" font-size="17" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Make a deck</text><rect x="656" y="128" width="258" height="42" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="668" y="150" font-size="13" fill="#1f2328" font-weight="400" font-family="ui-monospace,Consolas,Menlo,monospace" text-anchor="start">/sori:train</text><text x="658" y="202" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Name the transcript. You get</text><text x="658" y="222" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">slides and a study guide. Free in</text><text x="658" y="242" font-size="14" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Claude, no API key.</text></svg>
