<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Following a show, one sentence at a time"><rect width="960" height="410" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="30" y="44" font-size="20" fill="#1f2328" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Following a show, one sentence at a time</text><rect x="441.6" y="70" width="488.4" height="38" rx="12" fill="#1d4f91"/><text x="459.6" y="94" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">/sori:shows follow https://example.com/harbor-lane/feed.xml</text><rect x="30" y="120" width="556.8" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="144" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Added Harbor Lane Weekly. Transcribe its new episodes automatically?</text><rect x="586.0" y="170" width="344.0" height="38" rx="12" fill="#1d4f91"/><text x="604.0" y="194" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Yes, and put it in a folder called Work.</text><rect x="30" y="220" width="306.0" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="244" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Done. Auto is on and it is in Work.</text><rect x="707.6" y="270" width="222.39999999999998" height="38" rx="12" fill="#1d4f91"/><text x="725.6" y="294" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">What is new on my shows?</text><rect x="30" y="320" width="511.2" height="38" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="344" font-size="14" fill="#1f2328" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">One new episode. Say &quot;run the sweep&quot; and I will transcribe it.</text><text x="30" y="392" font-size="13" fill="#59636e" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">An illustration of the conversation, not a screenshot. Harbor Lane Weekly is a made-up show.</text></svg>
